name: GitHub Action + Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start local web server
        shell: bash
        run: |
          set -e

          echo "Starting Python web server on port 8080..."

          nohup python3 -m http.server 8080 \
            --bind 127.0.0.1 \
            > server.log 2>&1 &

          echo $! > server.pid

          echo "Server PID: $(cat server.pid)"

          echo "Waiting for local server..."

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:8080 \
              >/dev/null 2>&1; then

              echo "Local server is working."
              exit 0
            fi

            sleep 1
          done

          echo "ERROR: Local server did not start."
          cat server.log || true
          exit 1

      - name: Install cloudflared
        shell: bash
        run: |
          set -e

          echo "Downloading cloudflared..."

          curl -fL --retry 5 --retry-delay 2 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared

          sudo install -m 0755 \
            cloudflared \
            /usr/local/bin/cloudflared

          rm -f cloudflared

          echo "cloudflared version:"
          cloudflared --version

      - name: Start Cloudflare Tunnel
        shell: bash
        env:
          TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          set -e

          if [ -z "$TUNNEL_TOKEN" ]; then
            echo "ERROR: CF_TUNNEL_TOKEN is empty."
            echo "Add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Starting Cloudflare Tunnel..."

          nohup cloudflared tunnel \
            --no-autoupdate \
            run \
            --token "$TUNNEL_TOKEN" \
            > cloudflared.log 2>&1 &

          echo $! > cloudflared.pid

          echo "Tunnel PID: $(cat cloudflared.pid)"

          sleep 10

          if ! kill -0 "$(cat cloudflared.pid)" 2>/dev/null; then
            echo "ERROR: Cloudflare Tunnel stopped."
            echo
            echo "===== CLOUDFLARED LOG ====="
            cat cloudflared.log || true
            exit 1
          fi

          echo "Cloudflare Tunnel process is running."

      - name: Check services
        shell: bash
        run: |
          echo "===== LOCAL SERVER ====="

          curl -I \
            --max-time 10 \
            http://127.0.0.1:8080 \
            || true

          echo
          echo "===== CLOUDFLARED LOG ====="

          tail -n 100 cloudflared.log || true

      - name: Keep alive
        shell: bash
        run: |
          set -e

          SERVER_PID="$(cat server.pid)"
          TUNNEL_PID="$(cat cloudflared.pid)"

          echo "Server PID: $SERVER_PID"
          echo "Tunnel PID: $TUNNEL_PID"

          while true; do

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "ERROR: Web server stopped."
              cat server.log || true
              exit 1
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "ERROR: Cloudflare Tunnel stopped."
              tail -n 100 cloudflared.log || true
              exit 1
            fi

            sleep 30

          done
