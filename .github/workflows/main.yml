name: Run App With Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      PORT: "3000"
      HOST: "0.0.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project
        shell: bash
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

          echo
          echo "Searching for package.json..."

          PACKAGE_JSON="$(find . -type f -name package.json | head -n 1 || true)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "::error::No package.json found anywhere in the repository."
            echo "::error::Upload/push your Node.js project files to the repository first."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "Found package.json:"
          echo "$PACKAGE_JSON"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Cloudflare Secret
        shell: bash
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          set -e

          if [ -z "$CF_TUNNEL_TOKEN" ]; then
            echo "::error::CF_TUNNEL_TOKEN secret is missing."
            exit 1
          fi

          echo "Cloudflare secret found."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install cloudflared
        shell: bash
        run: |
          set -e

          curl -fL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared

          cloudflared --version

      - name: Start application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Starting application..."

          if npm run | grep -q "start"; then
            nohup npm start > "$GITHUB_WORKSPACE/app.log" 2>&1 &
          elif npm run | grep -q "dev"; then
            nohup npm run dev -- --host 0.0.0.0 --port "$PORT" \
              > "$GITHUB_WORKSPACE/app.log" 2>&1 &
          else
            echo "::error::No start or dev script found in package.json."
            cat package.json
            exit 1
          fi

          echo $! > "$GITHUB_WORKSPACE/app.pid"

          echo "Waiting for app on port $PORT..."

          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:$PORT" >/dev/null 2>&1; then
              echo "Application is running."
              exit 0
            fi

            sleep 2
          done

          echo "::error::Application did not start."
          echo "===== app.log ====="
          cat "$GITHUB_WORKSPACE/app.log" || true
          exit 1

      - name: Start Cloudflare Tunnel
        shell: bash
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          set -e

          nohup cloudflared tunnel \
            --no-autoupdate \
            run \
            --token "$CF_TUNNEL_TOKEN" \
            > "$GITHUB_WORKSPACE/cloudflared.log" 2>&1 &

          echo $! > "$GITHUB_WORKSPACE/cloudflared.pid"

          sleep 10

          if ! kill -0 "$(cat "$GITHUB_WORKSPACE/cloudflared.pid")" 2>/dev/null; then
            echo "::error::Cloudflare Tunnel stopped."
            echo "===== cloudflared.log ====="
            cat "$GITHUB_WORKSPACE/cloudflared.log" || true
            exit 1
          fi

          echo "Cloudflare Tunnel is running."

      - name: Keep alive
        shell: bash
        run: |
          while true; do
            if ! kill -0 "$(cat "$GITHUB_WORKSPACE/app.pid")" 2>/dev/null; then
              echo "::error::Application stopped."
              cat "$GITHUB_WORKSPACE/app.log" || true
              exit 1
            fi

            if ! kill -0 "$(cat "$GITHUB_WORKSPACE/cloudflared.pid")" 2>/dev/null; then
              echo "::error::Cloudflare Tunnel stopped."
              cat "$GITHUB_WORKSPACE/cloudflared.log" || true
              exit 1
            fi

            sleep 30
          done
